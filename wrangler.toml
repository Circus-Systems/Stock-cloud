name = "stock-filings"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# 20:00 UTC = 07:00 Sydney (AEDT) / 06:00 (AEST): after the US close and after the ASX day.
[triggers]
crons = ["0 20 * * *"]

[[r2_buckets]]
binding = "FILINGS"
bucket_name = "stock-filings"

[[durable_objects.bindings]]
name = "CRAWLER"
class_name = "Crawler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Crawler"]

[vars]
# SEC fair-access policy requires "Company Name contact@email" (browser-like strings are rejected as
# an undeclared automated tool). Replace the address with a real, monitored contact.
SEC_USER_AGENT = "circus-systems stock-cloud filings-archiver stock-cloud@circus.systems"
# "true" to also store the complete submission .txt for every SEC filing (large).
SEC_FULL_SUBMISSION = "false"

[observability]
enabled = true
